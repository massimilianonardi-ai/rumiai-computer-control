name: contract

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository contract structure
        run: npm run check

  clean-install-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install release layout from a clean prefix
        run: ./scripts/install.sh --portable-root "$RUNNER_TEMP/portable/bin"
      - name: Verify installed runtime and backend
        env:
          RUMIAI_CC_NODE: node
        run: |
          "$RUNNER_TEMP/portable/bin/rumiai-computer-control/current/scripts/rumiai-computer-control" doctor
